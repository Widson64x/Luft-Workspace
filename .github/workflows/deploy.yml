name: Deploy Luft-Workspace

on:
  push:
    branches:
      - main
      - homologacao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    
    steps:
    - name: Baixar código (Runner)
      uses: actions/checkout@v4

    - name: Atualizar Aplicação no Servidor
      shell: powershell
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message || 'Deploy manual' }}
        COMMIT_AUTHOR: ${{ github.actor }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        # --- CONFIGURAÇÕES ---
        $ServiceName = "Luft-Workspace"
        $AppPath = "C:\ProjetosPython\Luft-Workspace"
        $RunnerLogPath = "C:\GitHubRunners\Luft-Workspace"
        $LogFile = Join-Path $RunnerLogPath "deploy-log.txt"
        $NssmExe = "C:\nssm-2.24\win64\nssm.exe"
        $CheckoutPath = (Get-Location).Path
        $ErrorActionPreference = "Stop"
        $TranscriptStarted = $false
        $ServiceWasStopped = $false

        function Wait-ServiceState {
            param(
                [string]$Name,
                [string]$ExpectedStatus,
                [int]$TimeoutSeconds = 30
            )

            $Deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            do {
                $CurrentService = Get-Service -Name $Name -ErrorAction SilentlyContinue
                if ($CurrentService -and $CurrentService.Status.ToString() -eq $ExpectedStatus) {
                    return $true
                }
                Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $Deadline)

            return $false
        }

        try {
            New-Item -ItemType Directory -Path $RunnerLogPath -Force | Out-Null
            Start-Transcript -Path $LogFile -Append
            $TranscriptStarted = $true

            Write-Host "--- DEPLOY INICIADO: $(Get-Date) por $env:COMMIT_AUTHOR ---"
            Write-Host "Commit: $env:GITHUB_SHA"
            Write-Host "Mensagem: $env:COMMIT_MSG"

            if (-not (Test-Path -LiteralPath $NssmExe -PathType Leaf)) {
                throw "NSSM não encontrado em '$NssmExe'."
            }

            # Localiza o Python sem depender do PATH da conta do runner.
            $PythonCandidates = @(
                (Join-Path $AppPath ".venv\Scripts\python.exe"),
                "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
                "C:\Users\user_b2bi\AppData\Local\Programs\Python\Python313\python.exe"
            )
            $PythonCommand = Get-Command python -ErrorAction SilentlyContinue
            if ($PythonCommand) { $PythonCandidates += $PythonCommand.Source }
            $PyCommand = Get-Command py -ErrorAction SilentlyContinue
            if ($PyCommand) { $PythonCandidates += $PyCommand.Source }

            $PythonExe = $PythonCandidates |
                Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
                Select-Object -First 1
            if (-not $PythonExe) {
                throw "Executável do Python não foi localizado no ambiente do runner."
            }
            Write-Host "Python selecionado: $PythonExe"

            Write-Host "1. Validando e parando o serviço $ServiceName..."
            $ServiceObj = Get-Service -Name $ServiceName -ErrorAction SilentlyContinue
            if (-not $ServiceObj) {
                throw "O serviço Windows '$ServiceName' não está instalado."
            }

            if ($ServiceObj.Status -eq "Running") {
                & $NssmExe stop $ServiceName | Out-Host
                $ServiceWasStopped = $true
                if (-not (Wait-ServiceState -Name $ServiceName -ExpectedStatus "Stopped")) {
                    throw "O serviço '$ServiceName' não parou dentro do tempo limite."
                }
                Write-Host "Serviço parado com segurança."
            } else {
                Write-Host "Serviço já estava parado."
            }

            Write-Host "2. Sincronizando o repositório em $AppPath..."
            New-Item -Path $AppPath -ItemType Directory -Force | Out-Null
            & $PythonExe "$CheckoutPath\Utils\DeployMirror.py" $CheckoutPath $AppPath
            if ($LASTEXITCODE -ne 0) {
                throw "Falha ao sincronizar os arquivos da aplicação."
            }

            Write-Host "3. Preparando ambiente virtual e dependências..."
            Set-Location $AppPath
            $VenvPython = Join-Path $AppPath ".venv\Scripts\python.exe"
            if (-not (Test-Path -LiteralPath $VenvPython -PathType Leaf)) {
                Write-Host "Criando ambiente virtual..."
                & $PythonExe -m venv .venv
                if ($LASTEXITCODE -ne 0) {
                    throw "Falha ao criar o ambiente virtual."
                }
            }

            & $VenvPython -m pip install --disable-pip-version-check -r requirements.txt
            if ($LASTEXITCODE -ne 0) {
                throw "Falha ao instalar as dependências da aplicação."
            }

            Write-Host "4. Validando sintaxe da versão recebida..."
            & $VenvPython -m compileall -q App App.py Wsgi.py
            if ($LASTEXITCODE -ne 0) {
                throw "A validação de sintaxe da aplicação falhou."
            }

            Write-Host "5. Iniciando serviço $ServiceName..."
            & $NssmExe start $ServiceName | Out-Host
            if (-not (Wait-ServiceState -Name $ServiceName -ExpectedStatus "Running")) {
                throw "O serviço '$ServiceName' não iniciou dentro do tempo limite."
            }

            $ServiceWasStopped = $false
            Write-Host "SUCESSO: serviço iniciado e rodando."
            Write-Host "--- DEPLOY FINALIZADO ---"
        } catch {
            Write-Host "FALHA CRÍTICA NO DEPLOY: $($_.Exception.Message)" -ForegroundColor Red

            if ($ServiceWasStopped) {
                Write-Warning "Tentando religar o serviço após a falha do deploy..."
                & $NssmExe start $ServiceName | Out-Host
                if (-not (Wait-ServiceState -Name $ServiceName -ExpectedStatus "Running" -TimeoutSeconds 20)) {
                    Write-Warning "O serviço não pôde ser recuperado automaticamente. Consulte $LogFile."
                }
            }

            throw
        } finally {
            Set-Location $CheckoutPath
            if ($TranscriptStarted) {
                Stop-Transcript
            }
        }

  deploy_homologation:
    name: Deploy to Homologation
    if: github.ref == 'refs/heads/homologacao'
    runs-on: [self-hosted, Linux, homologacao]
    
    steps:
    - name: Baixar código (Runner)
      uses: actions/checkout@v4

    - name: Atualizar Aplicação no Servidor (Linux)
      shell: bash
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message || 'Deploy manual' }}
        COMMIT_AUTHOR: ${{ github.actor }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        # --- CONFIGURAÇÕES ---
        SERVICE_NAME="luft-workspace.service"
        APP_PATH="/home/suporte/Mirror_Python_80/ProjetosPython/Luft-Workspace"
        
        echo "--- DEPLOY INICIADO: $(date) por $COMMIT_AUTHOR ---"
        echo "Msg: $COMMIT_MSG"
        
        set -e

        echo "1. Verificando estado do serviço $SERVICE_NAME..."
        if sudo systemctl is-active --quiet $SERVICE_NAME; then
            echo "Status atual: RODANDO. Tentando parar..."
            sudo systemctl stop $SERVICE_NAME || echo "Aviso ao tentar parar."
            sleep 5
        else
            echo "O serviço já está PARADO ou não existe. Seguindo..."
        fi

        echo "2. Copiando arquivos para $APP_PATH..."
        mkdir -p $APP_PATH
        rsync -av --exclude='.git' --exclude='.venv' ./ $APP_PATH/
        
        echo "Arquivos copiados com sucesso."

        echo "3. Verificando dependências..."
        cd $APP_PATH
        
        if [ ! -d ".venv" ]; then
            echo "Criando venv..."
            python3 -m venv .venv
        fi
        
        echo "Instalando requirements..."
        .venv/bin/python -m pip install -r requirements.txt

        echo "4. Iniciando serviço $SERVICE_NAME..."
        sudo systemctl start $SERVICE_NAME || echo "Aviso ao tentar iniciar."
        
        sleep 5
        
        if sudo systemctl is-active --quiet $SERVICE_NAME; then
            echo "SUCESSO: Serviço iniciado e rodando!"
        else
            echo "FALHA CRÍTICA: O serviço não subiu."
            sudo systemctl status $SERVICE_NAME
            exit 1
        fi

        echo "--- DEPLOY FINALIZADO ---"
